<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">

  <!-- Background Rounded Square -->
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7F5AF0"/>
      <stop offset="100%" stop-color="#5B3FD6"/>
    </linearGradient>

    <linearGradient id="roofGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF7A18"/>
      <stop offset="100%" stop-color="#FF3D00"/>
    </linearGradient>

    <linearGradient id="houseGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE0B2"/>
      <stop offset="100%" stop-color="#FFCC80"/>
    </linearGradient>

    <linearGradient id="nestGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8D5524"/>
      <stop offset="100%" stop-color="#5D3311"/>
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="100" fill="url(#bgGradient)"/>

  <!-- Nest -->
  <ellipse cx="256" cy="330" rx="160" ry="50" fill="url(#nestGradient)"/>
  <ellipse cx="256" cy="320" rx="150" ry="40" fill="#A66A3F"/>

  <!-- Leaves -->
  <ellipse cx="120" cy="300" rx="25" ry="45" fill="#2ECC71" transform="rotate(-30 120 300)"/>
  <ellipse cx="392" cy="300" rx="25" ry="45" fill="#2ECC71" transform="rotate(30 392 300)"/>

  <!-- House Base -->
  <rect x="176" y="210" width="160" height="120" rx="15" fill="url(#houseGradient)"/>

  <!-- Roof -->
  <polygon points="160,230 256,150 352,230" fill="url(#roofGradient)"/>

  <!-- Chimney -->
  <rect x="210" y="170" width="30" height="50" rx="5" fill="#D2691E"/>

  <!-- Door -->
  <rect x="236" y="260" width="40" height="70" rx="8" fill="#6D4C41"/>
  <circle cx="268" cy="295" r="4" fill="#FFD54F"/>

  <!-- Window -->
  <rect x="290" y="240" width="45" height="45" rx="6" fill="#29B6F6"/>
  <line x1="312.5" y1="240" x2="312.5" y2="285" stroke="#ffffff" stroke-width="3"/>
  <line x1="290" y1="262.5" x2="335" y2="262.5" stroke="#ffffff" stroke-width="3"/>

</svg>